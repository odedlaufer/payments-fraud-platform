#single node install config
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
# The image's default enables a 2 GB in-memory file cache (cache-manager-memory.properties):
# it competed with query memory in a 1.8 GB heap. Off: the lake is local.

# Memory (Trino resource management): query memory is tracked and capped; the headroom is
# heap set aside for allocations Trino does not track (planning, Iceberg metadata, writer
# buffers). Too small a headroom was crashing the JVM (OutOfMemoryError: Java heap space);
# too large a heap left too little native memory in the container (kernel OOM kill).
# Constraint: query.max-memory-per-node + memory.heap-headroom-per-node < -Xmx (jvm.config).
query.max-memory-per-node=800MB
query.max-memory=800MB
memory.heap-headroom-per-node=800MB

# Parallelism sized to this node (Task properties): the defaults follow the CPU count, and
# each thread, driver and writer holds memory. Kept consistent with the container's 4 CPUs.
task.max-worker-threads=4
task.min-drivers=8
task.concurrency=4
task.max-writer-count=2
