name: payments-fraud-platform

# Profiles (PRD 10.1): core = OLTP + streaming, lake = object store + catalog + query.
# Select with COMPOSE_PROFILES, e.g. COMPOSE_PROFILES=core,lake (the Makefile default).

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16.6
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512m

  redpanda:
    <<: *restart
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    profiles: [core]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${REDPANDA_KAFKA_PORT:-19092}
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "127.0.0.1:${REDPANDA_KAFKA_PORT:-19092}:19092"
      - "127.0.0.1:${REDPANDA_SCHEMA_REGISTRY_PORT:-18081}:18081"
      - "127.0.0.1:19644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1536m

  console:
    <<: *restart
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    profiles: [core]
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "127.0.0.1:${REDPANDA_CONSOLE_PORT:-8080}:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m

  # S3-compatible object store for the Iceberg lakehouse (replaces MinIO, see ADR-002).
  # `mini` runs master, volume, filer and S3 gateway in one process and creates
  # LAKE_BUCKET on startup if it does not exist.
  seaweedfs:
    <<: *restart
    image: chrislusf/seaweedfs:4.51
    profiles: [lake]
    command:
      - mini
      - -dir=/data
      - -webdav=false
      - -s3.port.lance=0
      - -s3.port.iceberg=0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env}
      S3_BUCKET: ${LAKE_BUCKET:?set in .env}
    ports:
      - "127.0.0.1:${S3_API_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 768m

  # Postgres for the Iceberg catalog only, isolated from the OLTP source (ADR-002).
  catalog-db:
    <<: *restart
    image: postgres:16.6
    profiles: [lake]
    environment:
      POSTGRES_USER: ${CATALOG_DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?set in .env}
      POSTGRES_DB: ${CATALOG_DB_NAME:?set in .env}
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m

  # One-shot: applies Lakekeeper's schema migrations, then exits 0.
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.14.2
    profiles: [lake]
    command: ["migrate"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${CATALOG_DB_USER}:${CATALOG_DB_PASSWORD}@catalog-db:5432/${CATALOG_DB_NAME}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${CATALOG_DB_USER}:${CATALOG_DB_PASSWORD}@catalog-db:5432/${CATALOG_DB_NAME}
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:?set in .env}
      RUST_LOG: info
    depends_on:
      catalog-db:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128m

  # Iceberg REST catalog (ADR-002).
  lakekeeper:
    <<: *restart
    image: quay.io/lakekeeper/catalog:v0.14.2
    profiles: [lake]
    command: ["serve"]
    environment: *lakekeeper-env
    ports:
      - "127.0.0.1:${LAKEKEEPER_PORT:-8181}:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256m

  # One-shot: bootstraps Lakekeeper and creates the warehouse on SeaweedFS. Idempotent.
  lakekeeper-init:
    image: curlimages/curl:8.23.0
    profiles: [lake]
    entrypoint: ["sh", "/bootstrap.sh"]
    environment:
      LAKEKEEPER_URL: http://lakekeeper:8181
      WAREHOUSE_NAME: ${WAREHOUSE_NAME:?set in .env}
      LAKE_BUCKET: ${LAKE_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
    volumes:
      - ./scripts/lakekeeper-bootstrap.sh:/bootstrap.sh:ro
    depends_on:
      lakekeeper:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 64m

  # SQL engine over the lakehouse; dbt target (PRD section 3).
  trino:
    <<: *restart
    image: trinodb/trino:484
    profiles: [lake]
    environment:
      CATALOG_MANAGEMENT: static
      WAREHOUSE_NAME: ${WAREHOUSE_NAME}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${TRINO_PORT:-8088}:8080"
    volumes:
      - ./trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/etc/catalog/lake.properties:/etc/trino/catalog/lake.properties:ro
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 2560m

volumes:
  pg_data:
  redpanda_data:
  seaweedfs_data:
  catalog_db_data:
