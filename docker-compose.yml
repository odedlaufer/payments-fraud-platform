name: payments-fraud-platform

# Profiles (PRD 10.1): core = OLTP + streaming, lake = object store + catalog + query.
# Select with COMPOSE_PROFILES, e.g. COMPOSE_PROFILES=core,lake (the Makefile default).

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16.15
    profiles: [core]
    # Logical decoding for Debezium (FR-CDC1). max_slot_wal_keep_size stops a
    # stalled slot from filling the disk; DQ-02 alerts long before this limit.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - max_slot_wal_keep_size=1GB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 384m

  # One-shot: applies versioned OLTP migrations (postgres/migrations), then exits 0.
  postgres-migrate:
    image: ghcr.io/amacneil/dbmate:2.37.0
    profiles: [core]
    command: ["--wait", "--migration-lock", "--no-dump-schema", "up", "--strict"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /migrations
    volumes:
      - ./postgres/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 64m

  redpanda:
    <<: *restart
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    profiles: [core]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=768M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:${REDPANDA_KAFKA_PORT:-19092}
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://127.0.0.1:18082
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "127.0.0.1:${REDPANDA_KAFKA_PORT:-19092}:19092"
      - "127.0.0.1:${REDPANDA_SCHEMA_REGISTRY_PORT:-18081}:18081"
      - "127.0.0.1:19644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1024m

  # One-shot: sets service-account passwords from .env (postgres/roles.psql).
  postgres-roles:
    image: postgres:16.15
    profiles: [core]
    entrypoint: ["psql", "-q", "-f", "/roles.psql"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?set in .env}
    volumes:
      - ./postgres/roles.psql:/roles.psql:ro
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 64m

  # Kafka Connect worker running Debezium (FR-CDC2). Connectors are registered
  # separately; the worker stores configs, offsets and status in Redpanda.
  connect:
    <<: *restart
    build: ./connect
    image: payments-fraud-platform/connect:3.7.0-avro-8.3.2
    profiles: [core]
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: payments-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      HEAP_OPTS: -Xms256m -Xmx384m
      # Connector configs reference ${env:...}; secrets never enter the config topic.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${CONNECT_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8083/connector-plugins"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
    depends_on:
      redpanda:
        condition: service_healthy
      postgres-roles:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1024m

  # One-shot: registers connect/connectors/*.json and waits until RUNNING. Idempotent.
  connect-init:
    image: curlimages/curl:8.23.0
    profiles: [core]
    entrypoint: ["sh", "/register-connectors.sh"]
    environment:
      CONNECT_URL: http://connect:8083
      CONNECTORS_DIR: /connectors
    volumes:
      - ./scripts/register-connectors.sh:/register-connectors.sh:ro
      - ./connect/connectors:/connectors:ro
    depends_on:
      connect:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 64m

  console:
    <<: *restart
    image: docker.redpanda.com/redpandadata/console:v3.13.1
    profiles: [core]
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "127.0.0.1:${REDPANDA_CONSOLE_PORT:-8080}:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m

  # S3-compatible object store for the Iceberg lakehouse (replaces MinIO, see ADR-002).
  # `mini` runs master, volume, filer and S3 gateway in one process and creates
  # LAKE_BUCKET on startup if it does not exist.
  seaweedfs:
    <<: *restart
    image: chrislusf/seaweedfs:4.51
    profiles: [lake]
    command:
      - mini
      - -dir=/data
      - -webdav=false
      - -s3.port.lance=0
      - -s3.port.iceberg=0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env}
      S3_BUCKET: ${LAKE_BUCKET:?set in .env}
    ports:
      - "127.0.0.1:${S3_API_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 512m

  # Postgres for the Iceberg catalog only, isolated from the OLTP source (ADR-002).
  catalog-db:
    <<: *restart
    image: postgres:16.15
    profiles: [lake]
    environment:
      POSTGRES_USER: ${CATALOG_DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?set in .env}
      POSTGRES_DB: ${CATALOG_DB_NAME:?set in .env}
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m

  # One-shot: applies Lakekeeper's schema migrations, then exits 0.
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.14.2
    profiles: [lake]
    command: ["migrate"]
    environment: &lakekeeper-env
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${CATALOG_DB_USER}:${CATALOG_DB_PASSWORD}@catalog-db:5432/${CATALOG_DB_NAME}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${CATALOG_DB_USER}:${CATALOG_DB_PASSWORD}@catalog-db:5432/${CATALOG_DB_NAME}
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:?set in .env}
      RUST_LOG: info
    depends_on:
      catalog-db:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128m

  # Iceberg REST catalog (ADR-002).
  lakekeeper:
    <<: *restart
    image: quay.io/lakekeeper/catalog:v0.14.2
    profiles: [lake]
    command: ["serve"]
    environment: *lakekeeper-env
    ports:
      - "127.0.0.1:${LAKEKEEPER_PORT:-8181}:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256m

  # One-shot: bootstraps Lakekeeper and creates the warehouse on SeaweedFS. Idempotent.
  lakekeeper-init:
    image: curlimages/curl:8.23.0
    profiles: [lake]
    entrypoint: ["sh", "/bootstrap.sh"]
    environment:
      LAKEKEEPER_URL: http://lakekeeper:8181
      WAREHOUSE_NAME: ${WAREHOUSE_NAME:?set in .env}
      LAKE_BUCKET: ${LAKE_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
    volumes:
      - ./scripts/lakekeeper-bootstrap.sh:/bootstrap.sh:ro
    depends_on:
      lakekeeper:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 64m

  # SQL engine over the lakehouse; dbt target (PRD section 3).
  trino:
    <<: *restart
    image: trinodb/trino:484
    profiles: [lake]
    environment:
      CATALOG_MANAGEMENT: static
      WAREHOUSE_NAME: ${WAREHOUSE_NAME}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${TRINO_PORT:-8088}:8080"
    volumes:
      - ./trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./trino/etc/catalog/lake.properties:/etc/trino/catalog/lake.properties:ro
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1536m

  # Flink session cluster (ADR-001, ADR-002): one JobManager, one TaskManager.
  flink-jobmanager:
    <<: *restart
    build: ./flink
    image: payments-fraud-platform/flink:2.1.3-iceberg-1.12.0
    profiles: [stream]
    command: jobmanager
    environment: &flink-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        # Clients (sql-client, flink CLI) submit here; the image default is 0.0.0.0.
        rest.address: flink-jobmanager
        jobmanager.memory.process.size: 768m
        taskmanager.memory.process.size: 1280m
        # Jobs keep state on the heap (no RocksDB), so little managed memory is needed.
        taskmanager.memory.managed.fraction: 0.1
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 1
        state.backend.type: hashmap
        execution.checkpointing.dir: s3://lake/flink/checkpoints
        execution.checkpointing.savepoint-dir: s3://lake/flink/savepoints
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        s3.endpoint: http://seaweedfs:8333
        s3.path.style.access: true
        s3.access-key: ${S3_ACCESS_KEY}
        s3.secret-key: ${S3_SECRET_KEY}
      # Checkpoints and savepoints on SeaweedFS (FR-F4).
      ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-presto-2.1.3.jar
      # S3FileIO reads these through the AWS SDK default credential chain.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: us-east-1
    ports:
      - "127.0.0.1:${FLINK_UI_PORT:-8081}:8081"
    volumes:
      - ./flink/sql:/opt/flink/sql:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /overview HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 30
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 896m

  flink-taskmanager:
    <<: *restart
    image: payments-fraud-platform/flink:2.1.3-iceberg-1.12.0
    profiles: [stream]
    command: taskmanager
    environment: *flink-env
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1408m

  # One-shot: creates the bronze Iceberg tables (generated, idempotent).
  bronze-ddl:
    image: trinodb/trino:484
    profiles: [stream]
    entrypoint: ["trino", "--server", "http://trino:8080", "-f", "/ddl/bronze.sql"]
    volumes:
      - ./trino/ddl:/ddl:ro
    depends_on:
      trino:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 384m

  # One-shot: submits long-running Flink SQL jobs that are not already running.
  flink-jobs:
    image: payments-fraud-platform/flink:2.1.3-iceberg-1.12.0
    profiles: [stream]
    command: ["bash", "/submit-flink-jobs.sh"]
    environment: *flink-env
    volumes:
      - ./flink/sql:/opt/flink/sql:ro
      - ./scripts/submit-flink-jobs.sh:/submit-flink-jobs.sh:ro
    depends_on:
      flink-taskmanager:
        condition: service_started
      bronze-ddl:
        condition: service_completed_successfully
      connect-init:
        condition: service_completed_successfully
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 768m

volumes:
  pg_data:
  redpanda_data:
  seaweedfs_data:
  catalog_db_data:
