name: payments
version: "0.1.0"
profile: payments
config-version: 2

model-paths: [models]
macro-paths: [macros]
test-paths: [tests]
target-path: target
clean-targets: [target, dbt_packages]

flags:
  send_anonymous_usage_stats: false

# Failing tests keep their rows in lake.dq_failures.<test>, so a failure names the bad keys.
data_tests:
  payments:
    +store_failures: true
    +schema: dq_failures

models:
  payments:
    staging:
      +schema: staging
      +materialized: view
    silver:
      +schema: silver
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: append_new_columns
    # PRD namespace `snapshots`; built from the CDC log, not dbt snapshots (ADR-006).
    scd2:
      +schema: snapshots
      +materialized: table
