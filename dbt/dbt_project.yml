name: payments
version: "0.1.0"
profile: payments
config-version: 2

model-paths: [models]
macro-paths: [macros]
test-paths: [tests]
target-path: target
clean-targets: [target, dbt_packages]

flags:
  send_anonymous_usage_stats: false

# Failing tests keep their rows in lake.dq_failures.<test>, so a failure names the bad keys.
data_tests:
  payments:
    +store_failures: true
    +schema: dq_failures

models:
  payments:
    staging:
      +schema: staging
      +materialized: view
    silver:
      +schema: silver
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: append_new_columns
    # PRD namespace `snapshots`; built from the CDC log, not dbt snapshots (ADR-006).
    scd2:
      +schema: snapshots
      +materialized: table
    # Point-in-time facts for training sets, parity and backtests (Phase 4).
    marts:
      +schema: marts
      +materialized: table
    # Offline features (FR-PAR1), generated by `uv run features dbt` (ADR-003).
    features:
      +schema: features
      +materialized: table
    # Operational records (FR-PAR3 mismatches); ops.dq_results is written by scripts.
    ops:
      +schema: ops
      +materialized: table
