version: 2

models:
  - name: parity_joined
    description: >-
      One row per decision with its logged snapshot and offline features (input to
      parity_comparisons, computed once). Generated by `uv run features dbt`.
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]
  - name: parity_comparisons
    description: >-
      One row per decision per feature: logged value, offline value, whether they match
      (FR-PAR2). Generated by `uv run features dbt`.
    columns:
      - name: transaction_id
        data_tests: [not_null]
      - name: feature
        data_tests: [not_null]
  - name: parity_daily
    description: >-
      Parity per simulated day, per feature and per decision ('(all features)': the SLO).
  - name: parity_mismatches
    description: Every mismatch with both values and a likely cause (FR-PAR3).
    columns:
      - name: cause
        data_tests:
          - accepted_values:
              arguments:
                values: [definition_drift, late_event, unexplained]

  - name: training_set
    description: >-
      Point-in-time training set for a cutoff (FR-PIT2): mature transactions, features and
      dimensions as of the event, labels as known at the cutoff. Never the current status.
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]
      - name: label
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
