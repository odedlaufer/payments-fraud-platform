[project]
name = "payments-fraud-platform"
version = "0.1.0"
description = "Payments CDC lakehouse and real-time fraud feature platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.8.6",
    "mypy==1.14.1",
    "sqlfluff==3.3.0",
    "pre-commit==4.0.1",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pyyaml==6.0.2",
    "types-pyyaml==6.0.12.20241230",
    "psycopg[binary]==3.3.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: needs the running stack (make up)"]
