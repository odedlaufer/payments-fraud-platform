[project]
name = "payments-fraud-platform"
version = "0.1.0"
description = "Payments CDC lakehouse and real-time fraud feature platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = ["payments-simulator", "payments-features", "payments-decision", "payments-rules", "payments-backtester", "payments-orchestration", "payments-demo"]

[tool.uv.workspace]
members = ["simulator", "features", "decision_service", "rules", "backtester", "orchestration", "demo"]

[tool.uv.sources]
payments-simulator = { workspace = true }
payments-features = { workspace = true }
payments-decision = { workspace = true }
payments-rules = { workspace = true }
payments-backtester = { workspace = true }
payments-orchestration = { workspace = true }
payments-demo = { workspace = true }

[dependency-groups]
dev = [
    "ruff==0.8.6",
    "mypy==1.14.1",
    "sqlfluff==3.3.0",
    "pre-commit==4.0.1",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pyyaml==6.0.2",
    "types-pyyaml==6.0.12.20241230",
    "psycopg[binary]==3.3.6",
    "confluent-kafka[avro,schemaregistry]==2.16.0",
    "trino==0.340.0",
    "duckdb==1.5.6",
    "pyiceberg==0.12.0",
    "httpx==0.28.1",
]
# Transformations on Trino (PRD: dbt Core + dbt-trino).
dbt = [
    "dbt-core==1.12.6",
    "dbt-trino==1.11.0",
]

[tool.uv]
default-groups = ["dev", "dbt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
# trino/ in the repo is Trino server config, not the Python client.
known-third-party = ["trino"]
known-first-party = [
    "simulator", "features", "decision_service", "rules", "cdc_reconcile", "gen_bronze", "features_check", "decisions_check", "bronze_replay",
    "gen_decisions_bronze",
    "bronze_decisions_reconcile",
    "offline_features_check",
    "cdc_snapshot",
    "parity_report",
    "publish_training_set",
    "promote_rules",
    "lake_refs",
    "dlq_replay",
    "gen_contracts",
    "emit_lineage",
    "export_backtest_fixture",
    "slo_report",
    "slo_run",
    "present",
    "iceberg_maintenance",]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not flink'"
markers = [
    "integration: needs the running stack (make up)",
    "flink: runs real Flink (make test-flink: isolated env with PyFlink and Java 17+)",
]
