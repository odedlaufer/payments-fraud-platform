[project]
name = "payments-rules"
version = "0.1.0"
description = "Versioned fraud rules and the engine shared by decisions and backtests (FR-D2)"
requires-python = ">=3.12,<3.13"
dependencies = ["pyyaml==6.0.2"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rules"
