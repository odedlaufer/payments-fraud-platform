# Generated by make contracts from agreements.yaml and the live schemas.
apiVersion: v3.2.0
kind: DataContract
id: payments-training-set
name: Point-in-time training sets
version: 1.0.0
status: active
description:
  purpose: Features as of each transaction, labels as known at the cutoff.
  usage: Backtester (FR-BT1), the rule promotion gate, model training.
  limitations: Each set is pinned to an Iceberg snapshot and tagged; reproduce with FOR VERSION AS OF.
team:
  name: data-platform
  members:
  - username: odedlaufer
    role: owner
schema:
- name: training_set
  physicalType: table
  physicalName: training_set
  logicalType: object
  description: 'Point-in-time training set for a cutoff (FR-PIT2): mature transactions, features and dimensions
    as of the event, labels as known at the cutoff. Never the current status.'
  properties:
  - name: transaction_id
    physicalType: bigint
    logicalType: integer
    primaryKey: true
    primaryKeyPosition: 2
    required: true
  - name: card_id
    physicalType: bigint
    logicalType: integer
  - name: merchant_id
    physicalType: bigint
    logicalType: integer
  - name: event_ms
    physicalType: bigint
    logicalType: integer
  - name: txn_count_1m
    physicalType: bigint
    logicalType: integer
  - name: txn_count_1h
    physicalType: bigint
    logicalType: integer
  - name: txn_count_24h
    physicalType: bigint
    logicalType: integer
  - name: txn_amount_sum_1h
    physicalType: decimal(18,2)
    logicalType: number
  - name: txn_amount_sum_24h
    physicalType: decimal(18,2)
    logicalType: number
  - name: distinct_merchants_1h
    physicalType: bigint
    logicalType: integer
  - name: amount_vs_avg_30d
    physicalType: double
    logicalType: number
  - name: km_from_last_txn
    physicalType: double
    logicalType: number
  - name: minutes_since_last_txn
    physicalType: double
    logicalType: number
  - name: new_device_24h
    physicalType: boolean
    logicalType: boolean
  - name: profile_change_24h
    physicalType: boolean
    logicalType: boolean
  - name: merchant_refund_rate_7d
    physicalType: double
    logicalType: number
  - name: definitions_version
    physicalType: integer
    logicalType: integer
  - name: event_ts
    physicalType: timestamp(6) with time zone
    logicalType: date
  - name: cutoff
    physicalType: timestamp(6) with time zone
    logicalType: date
    primaryKey: true
    primaryKeyPosition: 1
    required: true
  - name: amount
    physicalType: decimal(12,2)
    logicalType: number
  - name: currency
    physicalType: varchar
    logicalType: string
  - name: channel
    physicalType: varchar
    logicalType: string
  - name: device_risk_score
    physicalType: decimal(5,4)
    logicalType: number
  - name: card_type
    physicalType: varchar
    logicalType: string
  - name: card_status_at_event
    physicalType: varchar
    logicalType: string
  - name: card_credit_limit_at_event
    physicalType: decimal(12,2)
    logicalType: number
  - name: customer_risk_tier_at_event
    physicalType: varchar
    logicalType: string
  - name: customer_country
    physicalType: varchar
    logicalType: string
  - name: merchant_mcc_at_event
    physicalType: varchar
    logicalType: string
  - name: merchant_category_at_event
    physicalType: varchar
    logicalType: string
  - name: merchant_country
    physicalType: varchar
    logicalType: string
  - name: merchant_status_at_event
    physicalType: varchar
    logicalType: string
  - name: card_version_from
    physicalType: timestamp(6) with time zone
    logicalType: date
  - name: customer_version_from
    physicalType: timestamp(6) with time zone
    logicalType: date
  - name: merchant_version_from
    physicalType: timestamp(6) with time zone
    logicalType: date
  - name: label
    physicalType: integer
    logicalType: integer
  - name: label_known_at
    physicalType: timestamp(6) with time zone
    logicalType: date
  - name: label_coverage_from
    physicalType: timestamp(6) with time zone
    logicalType: date
  - name: training_set_version
    physicalType: integer
    logicalType: integer
  quality:
  - type: sql
    description: No transaction younger than the 60-day maturity at its cutoff (FR-PIT2)
    query: SELECT count(*) FROM {object} WHERE event_ts > cutoff - INTERVAL '60' DAY
    mustBe: 0
  - type: sql
    description: Labels are 0 or 1
    query: SELECT count(*) FROM {object} WHERE label NOT IN (0, 1)
    mustBe: 0
  - type: sql
    description: No positive label known after its cutoff (no leakage, FR-PIT3)
    query: SELECT count(*) FROM {object} WHERE label = 1 AND label_known_at > cutoff
    mustBe: 0
servers:
